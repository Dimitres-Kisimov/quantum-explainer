name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Simulator tests + structural verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Syntax-check all JavaScript
        run: |
          node --check sim.js
          node --check app.js
          node --check selftest.js
          node --check sw.js
          node --check test/sim.test.mjs
          node --check tools/verify.mjs

      - name: Run simulator test harness (81 assertions)
        run: node test/sim.test.mjs

      - name: Run the portable correctness self-test (also the in-browser ?selftest=1 suite)
        run: node selftest.js

      - name: Run structural + offline verifier (75 checks)
        run: node tools/verify.mjs

      - name: Offline guard — no external asset references in app files
        run: |
          # The app must stay 100% offline: no external URLs, CDNs, web fonts,
          # or network APIs in any file the browser loads. grep exits 0 on a
          # match, so a hit fails this step via the leading '!'.
          ! grep -nE "(src|href)[[:space:]]*=[[:space:]]*[\"']https?:|@import|@font-face|url\([[:space:]]*[\"']?https?:|googleapis|gstatic|cdn\.|unpkg|jsdelivr|cloudflare|typekit|fontawesome|bootstrapcdn|XMLHttpRequest|WebSocket|sendBeacon|EventSource|<iframe" \
            index.html styles.css app.js sim.js selftest.js sw.js manifest.webmanifest icons/icon.svg

  python-tools:
    name: Ruff on helper scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint tools/
        run: python -m ruff check .
